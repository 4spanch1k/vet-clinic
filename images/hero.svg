<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="A veterinarian listens to a dog's heart with a stethoscope">
  <rect width="1200" height="900" fill="#cfeae6"/>
  <circle cx="190" cy="170" r="260" fill="#b9e0da"/>
  <circle cx="1040" cy="760" r="300" fill="#fbdcc8"/>
  <circle cx="1010" cy="140" r="90" fill="#e3f4f1"/>

  <!-- medical cross + paw prints -->
  <g fill="#0a6f69" opacity=".9">
    <rect x="975" y="96" width="70" height="22" rx="8" transform="translate(0 33)"/>
    <rect x="999" y="72" width="22" height="70" rx="8" transform="translate(0 33)"/>
  </g>
  <g fill="#8fcfc6">
    <ellipse cx="120" cy="610" rx="28" ry="24"/>
    <circle cx="86" cy="574" r="11"/><circle cx="112" cy="560" r="11"/><circle cx="140" cy="560" r="11"/><circle cx="162" cy="578" r="11"/>
