    <path d="M290 450l45 95 45-95z" fill="#0a6f69"/>
    <path d="M318 450l17 40 17-40z" fill="#f0c49c"/>
    <rect x="315" y="402" width="40" height="60" rx="18" fill="#e9b88c"/>
    <circle cx="335" cy="340" r="84" fill="#f0c49c"/>
    <path d="M250 335c-6-86 62-122 120-110 52 11 70 54 64 96-20-34-60-52-100-44-36 7-62 26-84 58z" fill="#2f2118"/>
