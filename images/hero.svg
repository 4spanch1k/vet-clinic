    <path d="M420 560c60 10 120 30 190 50" fill="none" stroke="#fff" stroke-width="64" stroke-linecap="round"/>
    <path d="M560 596c30 10 60 20 82 26" fill="none" stroke="#f0c49c" stroke-width="44" stroke-linecap="round"/>
  </g>

  <!-- dog -->
  <g>
    <path d="M905 640c60 4 110-30 100-96-4-24-30-30-34-8-6 36-30 56-66 58z" fill="#c98a4f"/>
    <ellipse cx="800" cy="580" rx="150" ry="165" fill="#d9a066"/>
    <ellipse cx="790" cy="618" rx="82" ry="112" fill="#f4dfc5"/>
    <rect x="708" y="640" width="58" height="100" rx="29" fill="#d9a066"/>
    <rect x="814" y="640" width="58" height="100" rx="29" fill="#d9a066"/>
    <ellipse cx="737" cy="730" rx="40" ry="22" fill="#f4dfc5"/>
    <ellipse cx="843" cy="730" rx="40" ry="22" fill="#f4dfc5"/>
    <ellipse cx="682" cy="372" rx="48" ry="104" fill="#8a5a32" transform="rotate(14 682 372)"/>
    <ellipse cx="900" cy="372" rx="48" ry="104" fill="#8a5a32" transform="rotate(-14 900 372)"/>
    <circle cx="791" cy="372" r="125" fill="#d9a066"/>
    <ellipse cx="791" cy="428" rx="76" ry="60" fill="#f4dfc5"/>
