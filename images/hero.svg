    <circle cx="722" cy="622" r="27" fill="#2b4a47"/>
    <circle cx="722" cy="622" r="15" fill="#9fd4cc"/>
  </g>

  <!-- exam table -->
  <rect x="120" y="728" width="960" height="46" rx="23" fill="#4f7571"/>
  <rect x="190" y="774" width="36" height="78" rx="12" fill="#3d5d5a"/>
  <rect x="974" y="774" width="36" height="78" rx="12" fill="#3d5d5a"/>
  <ellipse cx="600" cy="866" rx="520" ry="16" fill="#0a6f69" opacity=".12"/>
