    <ellipse cx="791" cy="396" rx="27" ry="18" fill="#2b2b2b"/>
    <circle cx="741" cy="346" r="14" fill="#2b2b2b"/><circle cx="841" cy="346" r="14" fill="#2b2b2b"/>
    <circle cx="746" cy="341" r="4.5" fill="#fff"/><circle cx="846" cy="341" r="4.5" fill="#fff"/>
    <path d="M708 482c50 26 116 26 166 0" fill="none" stroke="#0a6f69" stroke-width="22" stroke-linecap="round"/>
    <circle cx="791" cy="512" r="17" fill="#ffc847"/>
